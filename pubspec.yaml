name: trimr
description: "TRIMR — A precision audio trimmer. Dark instrument UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  just_audio: ^0.10.5
  ffmpeg_kit_flutter_new: ^4.1.0
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.19.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
